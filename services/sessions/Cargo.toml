[package]
name = "sessions"
description = "AirPlay session handling: RTSP, pairing, receiver transport and output worker."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
mirroring = ["dep:mirror", "media/mirroring"]
