[package]
name = "media"
description = "AirPlay media receive, transmit and local output interfaces."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
mirroring = ["dep:mirror"]
hls = ["dep:hls", "dep:video", "hls/ffmpeg"]

[dependencies]
audio.workspace = true
audio_stream.workspace = true
codec.workspace = true
mirror = { workspace = true, optional = true }
hls = { workspace = true, optional = true }
video = { workspace = true, optional = true }
coordinator.workspace = true
anyhow.workspace = true
base64 = "0.22"
clock.workspace = true
tokio = { workspace = true, features = ["process"] }
plist.workspace = true
rand.workspace = true
pair.workspace = true
crypto.workspace = true
mdns.workspace = true
rtsp.workspace = true
rtp.workspace = true
timesync.workspace = true
fairplay.workspace = true
tracing.workspace = true
if-addrs.workspace = true
libc = "0.2"

[dev-dependencies]
mrp.workspace = true
