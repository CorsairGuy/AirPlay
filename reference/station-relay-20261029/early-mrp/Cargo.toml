[package]
name = "airplay_mrp"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "process", "sync", "time", "signal", "fs"] }
prost = "=0.14.4"
plist = "=1.10.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "v5"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[build-dependencies]
prost-build = "=0.14.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
