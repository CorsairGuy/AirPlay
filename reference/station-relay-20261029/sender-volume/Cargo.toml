[package]
name = "airplay_sender"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "io-std", "sync", "time", "signal", "process"] }
plist = "=1.10.3"
sha2 = "0.10"
hkdf = "0.12"
chacha20poly1305 = "0.10"
num-bigint = "0.4"
rand = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
