name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The peer-union integration fixture needs two distinct local IPv4 peers.
      # macOS does not configure the whole 127/8 range as Linux/Windows do.
      - name: Configure isolated loopback peer on macOS
        if: runner.os == 'macOS'
        run: sudo ifconfig lo0 alias 127.0.0.3
      - run: cargo test --workspace
      - run: cargo test -p runtime --features mirroring

  # Минимальный аудиопрофиль без зависимостей видео.
  audio-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p runtime --no-default-features
      - name: Audio profile excludes video and mirroring crates
        shell: bash
        run: |
          cargo tree -p runtime --no-default-features --prefix none > audio-tree.txt
          if grep -E '^(mirror|video|hls|capture) v' audio-tree.txt; then
            echo 'Unexpected video dependency in audio-only profile'
            exit 1
          fi

  # Звук зеркалирования (AAC-ELD) через libavcodec: фича ffmpeg.
  ffmpeg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libclang-dev pkg-config
      - run: cargo clippy --workspace --all-targets --features codec/ffmpeg,video/ffmpeg -- -D warnings

      - run: cargo test --workspace --features codec/ffmpeg,video/ffmpeg

  # Станция (ARMv7) и Raspberry Pi (ARM64): пока только проверка сборки.
  cross-check:
    strategy:
      fail-fast: false
      matrix:
        target: [armv7-unknown-linux-gnueabihf, aarch64-unknown-linux-gnu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo check --workspace --target ${{ matrix.target }}

  # C27: the receiver is started through the public runtime API by an example
  # harness (runtime/examples/interop_receiver.rs), not by a deleted CLI.
  interop-pyatv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "pyatv==0.14.5" "srptools==1.0.1"
      - run: cargo build -p runtime --example interop_receiver
      - name: Run the harness and the independent client
        run: |
          set -euo pipefail
          state="$(mktemp -d)"
          ./target/debug/examples/interop_receiver --name "CI Interop" --port 7123 --pin 1234 --state-dir "$state" > receiver.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; cat receiver.log; rm -rf "$state"' EXIT
          for _ in $(seq 1 100); do
            grep -q "READY 7123" receiver.log && break
            sleep 0.1
          done
          grep -q "READY 7123" receiver.log
          python tests/interop/pyatv_client.py 127.0.0.1 7123 1234
