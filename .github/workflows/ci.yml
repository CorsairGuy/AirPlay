name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The peer-union integration fixture needs two distinct local IPv4 peers.
      # macOS does not configure the whole 127/8 range as Linux/Windows do.
      - name: Configure isolated loopback peer on macOS
        if: runner.os == 'macOS'
        run: sudo ifconfig lo0 alias 127.0.0.3
      - run: cargo test --workspace
      - run: cargo test -p runtime --features mirroring

  # Минимальный аудиопрофиль без зависимостей видео.
  audio-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p runtime --no-default-features
      - name: Audio profile excludes video and mirroring crates
        shell: bash
        run: |
          cargo tree -p runtime --no-default-features --prefix none > audio-tree.txt
          if grep -E '^(mirror|video|hls|capture) v' audio-tree.txt; then
            echo 'Unexpected video dependency in audio-only profile'
            exit 1
          fi

  # Звук зеркалирования (AAC-ELD) через libavcodec: фича ffmpeg.
  ffmpeg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libclang-dev pkg-config
      - run: cargo clippy --workspace --all-targets --features codec/ffmpeg,video/ffmpeg -- -D warnings

      - run: cargo test --workspace --features codec/ffmpeg,video/ffmpeg

  # Станция (ARMv7) и Raspberry Pi (ARM64): пока только проверка сборки.
  cross-check:
    strategy:
      fail-fast: false
      matrix:
        target: [armv7-unknown-linux-gnueabihf, aarch64-unknown-linux-gnu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo check --workspace --target ${{ matrix.target }}

  # The former pyatv interop job launched the deleted CLI. Keep its client under
  # tests/interop; restore this job when a library-based test harness exists.
