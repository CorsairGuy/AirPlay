name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  # Звук зеркалирования (AAC-ELD) через libavcodec: фича ffmpeg.
  ffmpeg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libclang-dev pkg-config
      - run: cargo clippy --workspace --all-targets --features airplay/ffmpeg -- -D warnings
      - run: cargo test --workspace --features airplay/ffmpeg

  # Станция (ARMv7) и Raspberry Pi (ARM64): пока только проверка сборки.
  cross-check:
    strategy:
      fail-fast: false
      matrix:
        target: [armv7-unknown-linux-gnueabihf, aarch64-unknown-linux-gnu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo check --workspace --target ${{ matrix.target }}

  # Независимая проверка: криптография, сопряжение и MRP pyatv против живого сервера.
  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyatv "srptools==1.0.1"
      - run: cargo build -p airplay
      - name: pyatv против airplay serve
        env:
          AIRPLAY_STATE_DIR: ${{ runner.temp }}/airplay-state
        run: |
          ./target/debug/airplay serve --port 7123 --pin 1234 --no-mdns --mrp --audio null &
          for i in $(seq 1 50); do (echo > /dev/tcp/127.0.0.1/7123) 2>/dev/null && break; sleep 0.1; done
          python tests/interop/pyatv_client.py 127.0.0.1 7123 1234
