[package]
name = "ap_codec"
description = "Кодеки: ALAC и AAC на symphonia; AAC-ELD и видео H.264/H.265 (программно или аппаратно) через libavcodec."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
symphonia.workspace = true
thiserror.workspace = true
ffmpeg-next = { workspace = true, optional = true }

[features]
# AAC-ELD (звук зеркалирования экрана) через libavcodec. Нужны пакеты
# разработки FFmpeg (libavcodec-dev) и clang для bindgen.
ffmpeg = ["dep:ffmpeg-next"]
