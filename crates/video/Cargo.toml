[package]
name = "video"
description = "Декодирование видео на libavcodec и выдача кадров в подключаемый FrameSink."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
clock.workspace = true
codec.workspace = true
mirror.workspace = true
ffmpeg-next = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing.workspace = true

[dev-dependencies]
tokio.workspace = true

[features]
# Декодирование H.264/H.265 через libavcodec. Без неё остаётся только
# планировщик показа [`Pacer`].
ffmpeg = ["codec/ffmpeg", "dep:ffmpeg-next", "dep:tokio"]
