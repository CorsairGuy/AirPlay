[package]
name = "airplay"
description = "Демон и утилита AirPlay: `airplay` запускает транспорт и службы, остальные подкоманды им управляют."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
base.workspace = true
rtsp.workspace = true
pair.workspace = true
crypto.workspace = true
fairplay.workspace = true
mdns.workspace = true
device.workspace = true
rtp.workspace = true
sender.workspace = true
clock.workspace = true
codec.workspace = true
plist.workspace = true
audio.workspace = true
audio_stream.workspace = true
mirror = { workspace = true, optional = true }
video = { workspace = true, optional = true }
ipc.workspace = true
timesync.workspace = true
mediaremote.workspace = true
mrp.workspace = true
anyhow.workspace = true
tokio = { workspace = true, features = ["process"] }
libc = "0.2"
tracing.workspace = true
tracing-subscriber.workspace = true
rand.workspace = true
sha2.workspace = true
hex.workspace = true
uuid = { version = "1", features = ["v4", "v5"] }
if-addrs.workspace = true

[features]
default = ["mirroring"]
mirroring = ["dep:mirror", "dep:video"]
# Звук (AAC-ELD) и видео (H.264/H.265) зеркалирования через libavcodec.
ffmpeg = ["codec/ffmpeg", "video?/ffmpeg"]

[lints]
workspace = true
